<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Hola Mundo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #f5f7fc; color: #15213b; font-family: system-ui, sans-serif; }
    main { text-align: center; padding: 24px; }
    button { min-height: 64px; padding: 18px 40px; border: 0; border-radius: 18px; background: #2563eb; color: white; font: 600 22px system-ui, sans-serif; cursor: pointer; touch-action: manipulation; box-shadow: 0 8px 24px #2563eb30; }
    button:hover { background: #1d4ed8; }
    button:active { transform: scale(.98); }
    button:focus-visible { outline: 3px solid #15213b; outline-offset: 5px; }
    #message { position: fixed; top: calc(50% + 60px); left: 24px; right: 24px; margin: 0; font-size: 28px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <button type="button" id="hello">Púlsame</button>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById('hello').addEventListener('click', function () {
      document.getElementById('message').textContent = 'Hola Mundo';
    });
  </script>
</body>
</html>
